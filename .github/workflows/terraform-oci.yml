name: Terraform OCI

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'config/clusters/oci/**'
      - '!config/clusters/oci/bootstrap/**'
      - '!config/clusters/oci/**/*.md'
      - '.github/workflows/terraform-oci.yml'
      - 'tools/ci/oci-session.sh'
      - 'tools/ci/preflight-terraform-oci.sh'
  push:
    branches: [master]
    paths:
      - 'config/clusters/oci/**'
      - '!config/clusters/oci/bootstrap/**'
      - '!config/clusters/oci/**/*.md'
      - '.github/workflows/terraform-oci.yml'
      - 'tools/ci/oci-session.sh'
      - 'tools/ci/preflight-terraform-oci.sh'
  workflow_dispatch:
    inputs:
      operation:
        description: Verify both identities against master, or plan a reviewed PR
        required: true
        default: verify
        type: choice
        options:
          - verify
          - plan
      pull_request:
        description: PR number (required only for plan)
        required: false
        type: string
      head_sha:
        description: Exact reviewed PR head SHA (required only for plan)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: oci-platform-terraform-${{ (github.event_name == 'pull_request_target' || inputs.operation == 'plan') && format('pr-{0}', github.event.pull_request.number || inputs.pull_request || github.run_id) || 'master' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' || inputs.operation == 'plan' }}

jobs:
  preflight:
    if: github.repository == 'falcosecurity/test-infra' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
      statuses: write
    outputs:
      ref: ${{ steps.preflight.outputs.ref }}
      base_sha: ${{ steps.preflight.outputs.base_sha }}
      head_sha: ${{ steps.preflight.outputs.head_sha }}
      identities: ${{ github.event_name == 'push' && '["apply"]' || inputs.operation == 'verify' && '["plan","apply"]' || '["plan"]' }}
      terraform: ${{ steps.preflight.outputs.terraform }}
      trusted_ref: ${{ steps.preflight.outputs.trusted_ref }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          persist-credentials: false
      - name: Verify prerequisites and the reviewed revision
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATION: ${{ inputs.operation }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          OCI_OIDC_DOMAIN_URL: ${{ vars.OCI_OIDC_DOMAIN_URL }}
          OCI_OIDC_CLIENT_ID: ${{ vars.OCI_OIDC_CLIENT_ID }}
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
          STATE_BACKEND: ${{ vars.OCI_TERRAFORM_BACKEND }}
        run: bash tools/ci/preflight-terraform-oci.sh
      - name: Mark the PR plan as pending
        if: github.event_name == 'pull_request_target' || inputs.operation == 'plan'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ steps.preflight.outputs.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA, state: 'pending',
              context: 'Terraform OCI / plan', target_url: process.env.RUN_URL,
              description: 'OCI Terraform plan awaiting approval or execution.'
            });

  terraform:
    needs: preflight
    name: Terraform (${{ matrix.identity }}, ${{ github.event.pull_request.head.sha || inputs.head_sha || 'master' }})
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        identity: ${{ fromJSON(needs.preflight.outputs.identities) }}
    runs-on: ubuntu-24.04
    environment: oci-terraform-${{ matrix.identity }}
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      artifact_url: ${{ steps.artifact.outputs.artifact-url }}
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: platform/config/clusters/oci
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: '0'
      TF_LOG: 'OFF'
      TF_WORKSPACE: default
      TF_VAR_auth: SecurityToken
      TF_VAR_config_file_profile: CI
      OCI_OIDC_DOMAIN_URL: ${{ vars.OCI_OIDC_DOMAIN_URL }}
      OCI_SESSION_HELPER: ${{ github.workspace }}/ci/tools/ci/oci-session.sh
      OCI_IDENTITY: ${{ matrix.identity }}
    steps:
      - name: Checkout the trusted session helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.trusted_ref }}
          path: ci
          sparse-checkout: |
            tools/ci/oci-session.sh
            tools/ci/preflight-terraform-oci.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout the selected Terraform revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          path: platform
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ needs.preflight.outputs.terraform }}
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check
      - name: Recheck the approved revision and environment before authentication
        if: github.event_name == 'pull_request_target' || inputs.operation == 'plan'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PLAN_REF: ${{ needs.preflight.outputs.ref }}
        run: bash "$GITHUB_WORKSPACE/ci/tools/ci/preflight-terraform-oci.sh" recheck
      - name: Authenticate to OCI with GitHub OIDC
        id: identity
        env:
          OCI_OIDC_CLIENT_ID: ${{ vars.OCI_OIDC_CLIENT_ID }}
          OCI_OIDC_CLIENT_SECRET: ${{ secrets.OCI_OIDC_CLIENT_SECRET }}
          OCI_TENANCY_OCID: ${{ vars.OCI_TENANCY_OCID }}
        run: bash "$OCI_SESSION_HELPER" start
      - name: Terraform init
        env:
          STATE_BACKEND: ${{ vars.OCI_TERRAFORM_BACKEND }}
        run: |
          backend_args=(-backend-config=auth=SecurityToken -backend-config=config_file_profile=CI)
          for key in bucket namespace key region; do
            backend_args+=("-backend-config=$key=$(jq -er --arg key "$key" '.[$key]' <<< "$STATE_BACKEND")")
          done
          bash "$OCI_SESSION_HELPER" run init terraform init -input=false \
            -lockfile=readonly -lock-timeout=5m -no-color "${backend_args[@]}"
      - name: Terraform validate
        run: bash "$OCI_SESSION_HELPER" run validate terraform validate -no-color
      - name: Verify the existing platform state
        run: |
          bash "$OCI_SESSION_HELPER" run state terraform state list
          if ! grep -qx 'oci_containerengine_cluster.this' "$OCI_SESSION_DIR/state.log"; then
            echo 'The backend does not contain the existing OKE platform; refusing a new or unrelated state.' >&2
            exit 1
          fi
          if awk '/(^|\.)oci_identity_/ && !/(^|\.)data\.oci_identity_/ { found = 1 } END { exit !found }' "$OCI_SESSION_DIR/state.log"; then
            echo 'IAM resources must be managed in the manual bootstrap state, not the platform state.' >&2
            exit 1
          fi
      - name: Terraform plan
        id: plan
        run: |
          result=0
          bash "$OCI_SESSION_HELPER" run plan terraform plan -input=false -no-color \
            -lock-timeout=5m -detailed-exitcode \
            -out="$OCI_SESSION_DIR/plan" || result=$?
          case "$result" in
            0) echo 'changes=false' >> "$GITHUB_OUTPUT"; echo 'OCI Terraform: no changes.' ;;
            2) echo 'changes=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "OCI Terraform plan failed (exit $result)." >&2; exit "$result" ;;
          esac
      - name: Render the approved PR plan
        if: github.event_name == 'pull_request_target' || inputs.operation == 'plan'
        run: |
          bash "$OCI_SESSION_HELPER" run text terraform show -no-color "$OCI_SESSION_DIR/plan"
          mkdir -p "$RUNNER_TEMP/oci-plan-report"
          cp "$OCI_SESSION_DIR/text.log" "$RUNNER_TEMP/oci-plan-report/plan.txt"
      - name: Upload only the human-readable plan
        id: artifact
        if: github.event_name == 'pull_request_target' || inputs.operation == 'plan'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: oci-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/oci-plan-report/plan.txt
          if-no-files-found: error
          retention-days: 7
      - name: Apply the saved plan after merge
        if: github.event_name == 'push' && matrix.identity == 'apply' && steps.plan.outputs.changes == 'true'
        run: |
          bash "$OCI_SESSION_HELPER" run apply terraform apply -input=false \
            -no-color -lock-timeout=5m -parallelism=1 "$OCI_SESSION_DIR/plan"
      - name: Clean up OCI credentials and private Terraform files
        if: always() && steps.identity.outcome == 'success'
        working-directory: ${{ github.workspace }}
        run: bash "$OCI_SESSION_HELPER" cleanup

  report:
    needs: [preflight, terraform]
    if: >-
      always() && !cancelled() && github.repository == 'falcosecurity/test-infra' &&
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'pull_request_target' || inputs.operation == 'plan') &&
      (github.event.pull_request.head.sha != '' || needs.preflight.outputs.head_sha != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
      statuses: write
    steps:
      - name: Checkout the trusted revision check
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.trusted_ref || github.sha }}
          sparse-checkout: tools/ci/preflight-terraform-oci.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Recheck the planned revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha || needs.preflight.outputs.head_sha }}
          BASE_SHA: ${{ needs.preflight.outputs.base_sha }}
          PLAN_REF: ${{ needs.preflight.outputs.ref }}
        run: bash tools/ci/preflight-terraform-oci.sh recheck
      - name: Download the rendered plan
        id: download
        if: needs.terraform.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.terraform.outputs.artifact_id }}
          path: ${{ runner.temp }}/oci-plan-report
          merge-multiple: true
      - name: Publish the plan result
        id: comment
        if: "!cancelled() && steps.revision.outcome == 'success'"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          PLAN_READY: ${{ needs.terraform.result == 'success' && steps.download.outcome == 'success' }}
          PLAN_PATH: ${{ runner.temp }}/oci-plan-report/plan.txt
          PLAN_BODY: |
            <!-- terraform-oci-plan -->
            ### OCI Terraform plan

            Head: `${{ github.event.pull_request.head.sha || needs.preflight.outputs.head_sha }}`
            Base: `${{ needs.preflight.outputs.base_sha }}`

            <details><summary>Show plan preview</summary>

            <pre><!-- plan-preview --></pre>

            </details>

            [Complete text plan](${{ needs.terraform.outputs.artifact_url }}) · [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          FAILURE_BODY: |
            <!-- terraform-oci-plan -->
            ### OCI Terraform plan failed

            Head: `${{ github.event.pull_request.head.sha || needs.preflight.outputs.head_sha }}`

            The plan or its report did not complete successfully.
            [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
        with:
          script: |
            const issue = {...context.repo, issue_number: Number(process.env.PR_NUMBER)};
            let body = process.env.FAILURE_BODY;
            let planned = false;
            if (process.env.PLAN_READY === 'true') {
              try {
                const plan = require('node:fs').readFileSync(process.env.PLAN_PATH, 'utf8');
                if (!plan.trim()) throw new Error('Empty plan');
                const preview = plan.replace(/[&<>]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'}[c])).slice(0, 50000);
                body = process.env.PLAN_BODY.replace('<!-- plan-preview -->', () => preview);
                planned = true;
              } catch {
                core.warning('The rendered plan is missing or unreadable.');
              }
            }
            const comments = await github.paginate(github.rest.issues.listComments, {...issue, per_page: 100});
            const previous = comments.find(c => c.user?.login === 'github-actions[bot]' && c.body?.startsWith('<!-- terraform-oci-plan -->'));
            if (previous) {
              await github.rest.issues.updateComment({...context.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({...issue, body});
            }
            if (!planned) core.setFailed('The OCI Terraform plan is unavailable.');
      - name: Report the plan status
        if: "!cancelled()"
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || needs.preflight.outputs.head_sha }}
          PLAN_STATE: ${{ steps.comment.outcome == 'success' && 'success' || 'failure' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo, sha: process.env.HEAD_SHA, state: process.env.PLAN_STATE,
              context: 'Terraform OCI / plan', target_url: process.env.RUN_URL
            });
      - name: Fail when the plan report is unavailable
        if: "!cancelled() && steps.comment.outcome != 'success'"
        run: exit 1
