name: CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      aws: ${{ steps.clouds.outputs.aws }}
      oci: ${{ steps.clouds.outputs.oci }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Test cloud selection and required-check gate
        run: node --test tools/ci/changes.test.mjs
      - name: Select cloud checks from the PR merge diff
        id: clouds
        run: node tools/ci/changes.mjs --pull-request >> "$GITHUB_OUTPUT"

  aws:
    needs: changes
    if: needs.changes.outputs.aws == 'true'
    uses: ./.github/workflows/ci-aws.yml

  oci:
    needs: changes
    if: needs.changes.outputs.oci == 'true'
    uses: ./.github/workflows/ci-oci.yml

  # Keep the existing branch-protection context; failures cannot become skips.
  manifests-validation:
    needs: [changes, aws, oci]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Require every selected cloud to pass
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node tools/ci/changes.mjs --gate
