name: Validate OCI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned validators
        run: bash tools/ci/install-tools.sh
      - name: Validate OCI manifests and Prow configuration
        run: bash tools/ci/verify-manifests.sh oci

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read the OCI Terraform version
        id: version
        run: |
          version=$(tr -d '\n\r' < config/clusters/oci/.terraform-version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "terraform=$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false
      - name: Validate OCI Terraform without backend or credentials
        run: bash tools/ci/verify-terraform.sh
