name: Validate OCI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned validators
        run: bash tools/ci/install-tools.sh
      - name: Validate OCI manifests and Argo CD Applications
        run: bash tools/ci/verify-manifests.sh oci

  jobs-checker:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned Prow validation tools
        run: bash tools/ci/install-tools.sh prow
      - name: Validate OCI Prow configuration and jobs
        run: bash tools/ci/verify-prow.sh

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Read the OCI Terraform version
        id: version
        run: |
          version=$(tr -d '\n\r' < config/clusters/oci/.terraform-version)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "terraform=$version" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ steps.version.outputs.terraform }}
          terraform_wrapper: false
      - name: Validate OCI Terraform without backend or credentials
        run: bash tools/ci/verify-terraform.sh

  scan-terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Scan OCI Terraform
        shell: bash
        run: |
          scan_dir=$(mktemp -d "$RUNNER_TEMP/oci-terraform-scan.XXXXXXXX")
          chmod 755 "$scan_dir"
          # Scan the platform source only, without bootstrap, state or local inputs.
          cp config/clusters/oci/*.tf "$scan_dir/"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --user 65532:65532 \
            --tmpfs /tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$scan_dir,dst=/src,readonly" \
            bridgecrew/checkov:3.3.17@sha256:41c4701c6a56d8952e5aba7a420f871c8b70b57da94eb4f142dcdf7295bb0be3 \
            --directory /src --framework terraform --check 'CKV_OCI_*' \
            --skip-download --download-external-modules false --compact --quiet
