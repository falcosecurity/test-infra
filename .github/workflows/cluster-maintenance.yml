name: Cluster maintenance reminder

on:
  schedule:
    - cron: '17 7 1 */3 *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: cluster-maintenance-reminder
  cancel-in-progress: false

jobs:
  remind:
    if: github.repository == 'falcosecurity/test-infra' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Keep one open OKE maintenance issue
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const title = 'Review OKE cluster maintenance';
            for await (const {data} of github.paginate.iterator(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100
            })) {
              if (data.some(issue => !issue.pull_request && issue.title === title)) return;
            }
            await github.rest.issues.create({
              ...context.repo, title, labels: ['lifecycle/frozen'],
              body: [
                'Review the OKE cluster maintenance requirements:',
                '',
                '- [ ] Kubernetes control-plane and node-pool versions and support dates.',
                '- [ ] Pinned node images and operating-system security updates.',
                '- [ ] Cluster add-ons, autoscaler and platform-component compatibility.',
                '',
                'Track required updates through reviewed pull requests.'
              ].join('\n')
            });
