apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: prow-log-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: prow
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: test-pods
    objectSelector:
      matchLabels:
        created-by-prow: "true"
      matchExpressions:
        - key: prow.k8s.io/id
          operator: Exists
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
        scope: Namespaced
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              initContainers: has(object.spec.initContainers)
                ? object.spec.initContainers.filter(c,
                    c.name == "initupload" &&
                    c.image.startsWith("us-docker.pkg.dev/k8s-infra-prow/images/initupload:") &&
                    (!has(c.env) || !c.env.exists(e, e.name == "AWS_REQUEST_CHECKSUM_CALCULATION"))
                  ).map(c, Object.spec.initContainers{
                    name: c.name,
                    env: [Object.spec.initContainers.env{
                      name: "AWS_REQUEST_CHECKSUM_CALCULATION", value: "WHEN_REQUIRED"
                    }]
                  })
                : []
            }
          }
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{
            spec: Object.spec{
              containers: object.spec.containers.filter(c,
                c.name == "sidecar" &&
                c.image.startsWith("us-docker.pkg.dev/k8s-infra-prow/images/sidecar:") &&
                (!has(c.env) || !c.env.exists(e, e.name == "AWS_REQUEST_CHECKSUM_CALCULATION"))
              ).map(c, Object.spec.containers{
                name: c.name,
                env: [Object.spec.containers.env{
                  name: "AWS_REQUEST_CHECKSUM_CALCULATION", value: "WHEN_REQUIRED"
                }]
              })
            }
          }
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: prow-log-storage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: prow
spec:
  policyName: prow-log-storage
