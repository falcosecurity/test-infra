            main:
              protect: true
        contrib:
          branches:
            main:
              protect: true
        dbg-go:
          branches:
            main:
              protect: true
          required_status_checks:
            contexts:
              - build-and-test
        deploy-kubernetes:
          branches:
            main:
              protect: true
        driverkit:
          required_status_checks:
            contexts:
              - build-test-dev (amd64) / build-test
              - build-test-dev (arm64) / build-test
              - Enforce go.mod tidiness
          branches:
            master:
              protect: true
        elftoolchain:
          branches:
            main:
              protect: true
        evolution:
          branches:
            main:
              protect: true
        event-generator:
          required_status_checks:
            contexts:
              - build-and-test-amd64
              - build-and-test-arm64
