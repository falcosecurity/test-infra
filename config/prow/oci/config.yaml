prowjob_namespace: prow
pod_namespace: test-pods
decorate_all_jobs: false
deck:
  branding:
    header_color: '#00AEC7'
    logo: /static/branding/logo.png
    favicon: branding/favicon.png
  spyglass:
    lenses:
      - lens:
          name: metadata
        required_files:
          - ^(started|finished)\.json$
        optional_files:
          - ^podinfo\.json$
      - lens:
          name: buildlog
        required_files:
          - ^build-log\.txt$
      - lens:
          name: podinfo
        required_files:
          - ^podinfo\.json$
plank:
  job_queue_capacities:
    artifact-index: 1
    automation: 3
    driverkit-arm: 4
    driverkit-x86: 4
    governance: 1
  job_url_prefix_config:
    '*': https://prow.falco.org/view/
  default_decoration_config_entries:
    - config:
        timeout: 24h
        grace_period: 10m
        censor_secrets: true
        github_app_id: "5110708"
        github_app_private_key_secret:
          name: github-clone-readonly
          key: private-key
        utility_images:
          clonerefs: us-docker.pkg.dev/k8s-infra-prow/images/clonerefs:v20261022-def2183c3@sha256:f09fe2b63d0da0c3d0201cbd9ee3af56372ee5ebfd03494bb90238536549d8be
          initupload: us-docker.pkg.dev/k8s-infra-prow/images/initupload:v20261022-def2183c3@sha256:73293c04a59d1b8a7fbf51e3e56b0b2523b354fd71ba96695072d63939c93a24
          entrypoint: us-docker.pkg.dev/k8s-infra-prow/images/entrypoint:v20261022-def2183c3@sha256:d98ad0bd4d99f889597ae0040b06c5434f7ed10cb743e5044c828ce1e27a3b7a
          sidecar: us-docker.pkg.dev/k8s-infra-prow/images/sidecar:v20261022-def2183c3@sha256:e0ed385dbfa95b684e2b7830ce37bc374e2381d14ea6a4281b9aacf3317e9b48
        gcs_configuration:
          bucket: s3://falco-prow-logs
          path_strategy: explicit
        s3_credentials_secret: s3-credentials
branch-protection:
  enforce_admins: true
  required_linear_history: true
  restrictions:
    teams:
      - machine_users
  required_pull_request_reviews:
    dismiss_stale_reviews: true
    dismissal_restrictions:
      teams:
        - machine_users
    require_code_owner_reviews: true
    required_approving_review_count: 1
  required_status_checks:
    strict: false
  orgs:
    falcosecurity:
      required_status_checks:
        contexts:
          - dco
      repos:
        .github:
          branches:
            main:
              protect: true
        .project:
          branches:
            main:
              protect: true
        charts:
          required_status_checks:
            contexts:
              - test
              - readme
          branches:
            master:
              protect: true
        cncf-green-review-testing:
          branches:
            main:
              protect: true
        community:
