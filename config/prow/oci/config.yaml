tide:
  target_url: https://prow.falco.org/tide
  context_options:
    skip-unknown-contexts: true
    from-branch-protection: true
    orgs:
      falcosecurity:
        repos:
          .project:
            # Metadata workflows are skipped for changes outside the two YAML files.
            required-if-present-contexts:
              - validate-project
              - validate-maintainers
          test-infra:
            required-if-present-contexts:
              - Terraform OCI / plan
              - validate-dbg
              - build-update-dbg-image
  merge_method:
