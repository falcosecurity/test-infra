apiVersion: v1
kind: ServiceAccount
metadata:
  name: needs-rebase
  namespace: prow
  labels:
    app.kubernetes.io/name: needs-rebase
    app.kubernetes.io/component: external-plugin
    app.kubernetes.io/part-of: prow
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: needs-rebase
  namespace: prow
  labels:
    app.kubernetes.io/name: needs-rebase
    app.kubernetes.io/component: external-plugin
    app.kubernetes.io/part-of: prow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: needs-rebase
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: needs-rebase
  namespace: prow
  labels:
    app.kubernetes.io/name: needs-rebase
    app.kubernetes.io/component: external-plugin
    app.kubernetes.io/part-of: prow
    app.kubernetes.io/version: v20260811-cafa49460
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: needs-rebase
  template:
    metadata:
      labels:
        app.kubernetes.io/name: needs-rebase
        app.kubernetes.io/component: external-plugin
        app.kubernetes.io/part-of: prow
        app.kubernetes.io/version: v20260811-cafa49460
    spec:
      serviceAccountName: needs-rebase
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 180
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 65532
      containers:
        - name: needs-rebase
          image: us-docker.pkg.dev/k8s-infra-prow/images/needs-rebase:v20260811-cafa49460@sha256:68e65e169e75357b880f00f60e821021d80c4663eb624a4b7dec7dce98bb93be
          args:
            - --dry-run=false
            - --github-token-path=/etc/github/oauth
            - --github-endpoint=http://ghproxy
            - --github-endpoint=https://api.github.com
            - --plugin-config=/etc/prow/plugins/plugins.yaml
            - --hmac-secret-file=/etc/prow/webhook/hmac
            - --health-port=8081
          ports:
            - name: http
              containerPort: 8888
            - name: healthz
              containerPort: 8081
          startupProbe:
            httpGet:
              path: /healthz
              port: healthz
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: oauth
              mountPath: /etc/github
              readOnly: true
            - name: plugins
              mountPath: /etc/prow/plugins
              readOnly: true
            - name: hmac
              mountPath: /etc/prow/webhook
              readOnly: true
      volumes:
        - name: oauth
          secret:
            secretName: oauth-token
            defaultMode: 288
        - name: plugins
          configMap:
            name: plugins
        - name: hmac
          secret:
            secretName: hmac-token
            defaultMode: 288
      nodeSelector:
        Application: platform
        Archtype: x86
        kubernetes.io/arch: amd64
      tolerations:
        - key: dedicated.falco.org/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
