apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ghproxy
  namespace: prow
  labels:
    app.kubernetes.io/name: ghproxy
    app.kubernetes.io/component: github-api-cache
    app.kubernetes.io/part-of: prow
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: oci-bv-retain
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ghproxy
  namespace: prow
  labels:
    app.kubernetes.io/name: ghproxy
    app.kubernetes.io/component: github-api-cache
    app.kubernetes.io/part-of: prow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ghproxy
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghproxy
  namespace: prow
  labels:
    app.kubernetes.io/name: ghproxy
    app.kubernetes.io/component: github-api-cache
    app.kubernetes.io/part-of: prow
    app.kubernetes.io/version: v20260811-cafa49460
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ghproxy
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ghproxy
        app.kubernetes.io/component: github-api-cache
        app.kubernetes.io/part-of: prow
        app.kubernetes.io/version: v20260811-cafa49460
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ghproxy
          image: us-docker.pkg.dev/k8s-infra-prow/images/ghproxy:v20260811-cafa49460@sha256:e40113798952b457fcaab9fb9b8c19e95c71a93073bdf1710abc87d5bce91013
          imagePullPolicy: IfNotPresent
          args:
            - --cache-dir=/cache
            - --cache-sizeGB=99
            - --legacy-disable-disk-cache-partitions-by-auth-header=false
            - --serve-metrics=true
            - --health-port=8081
            - --metrics-port=9090
            - --log-level=info
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: healthz
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: healthz
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: ghproxy
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      nodeSelector:
        Application: platform
        Archtype: x86
        kubernetes.io/arch: amd64
      tolerations:
        - key: dedicated.falco.org/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
