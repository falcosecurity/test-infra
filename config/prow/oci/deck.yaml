apiVersion: v1
kind: Service
metadata:
  name: deck
  namespace: prow
  labels:
    app.kubernetes.io/name: deck
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: prow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: deck
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deck
  namespace: prow
  labels:
    app.kubernetes.io/name: deck
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: prow
    app.kubernetes.io/version: v20260811-cafa49460
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: deck
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deck
        app.kubernetes.io/component: dashboard
        app.kubernetes.io/part-of: prow
        app.kubernetes.io/version: v20260811-cafa49460
    spec:
      serviceAccountName: deck
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deck
          image: us-docker.pkg.dev/k8s-infra-prow/images/deck:v20260811-cafa49460@sha256:d3926335f02367fbb9a8bda575640a885ff5a0bce4e6679713241525eb1e923c
          imagePullPolicy: IfNotPresent
          args:
            - --config-path=/etc/prow/config/config.yaml
            - --dry-run=true
            - --rerun-creates-job=false
            - --spyglass=true
            - --s3-credentials-file=/etc/s3-credentials/service-account.json
            - --health-port=8081
            - --metrics-port=9090
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: healthz
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: healthz
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: healthz
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/prow/config
              readOnly: true
            - name: branding
              mountPath: /var/run/ko/static/branding
              readOnly: true
            - name: s3-credentials
              mountPath: /etc/s3-credentials
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: config
            defaultMode: 0444
        - name: branding
          configMap:
            name: branding
            defaultMode: 0444
        - name: s3-credentials
          secret:
            secretName: s3-credentials
            defaultMode: 0440
            items:
              - key: service-account.json
                path: service-account.json
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      nodeSelector:
        Application: platform
        Archtype: x86
        kubernetes.io/arch: amd64
      tolerations:
        - key: dedicated.falco.org/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: deck
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: deck
  namespace: prow
  labels:
    app.kubernetes.io/name: deck
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: prow
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: deck
