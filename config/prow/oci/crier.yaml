---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: crier
  namespace: prow
  labels:
    app.kubernetes.io/name: crier
    app.kubernetes.io/component: reporter
    app.kubernetes.io/part-of: prow
    app.kubernetes.io/version: v20260811-cafa49460
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: crier
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crier
        app.kubernetes.io/component: reporter
        app.kubernetes.io/part-of: prow
        app.kubernetes.io/version: v20260811-cafa49460
    spec:
      serviceAccountName: crier
      automountServiceAccountToken: true
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crier
          image: us-docker.pkg.dev/k8s-infra-prow/images/crier:v20260811-cafa49460@sha256:9dd8df36b816fc383e5004ccf4eca793240772d11ef5e2949f55a1275c48a355
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: WHEN_REQUIRED
          args:
            - --dry-run=false
            - --config-path=/etc/prow/config/config.yaml
            - --blob-storage-workers=1
            - --kubernetes-blob-storage-workers=1
            - --github-workers=0
            - --s3-credentials-file=/etc/s3-credentials/service-account.json
            - --metrics-port=9090
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /metrics
              port: metrics
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            failureThreshold: 3
            periodSeconds: 5
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/prow/config
              readOnly: true
            - name: s3-credentials
              mountPath: /etc/s3-credentials
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: config
            defaultMode: 0444
        - name: s3-credentials
          secret:
            secretName: s3-credentials
            defaultMode: 0440
            items:
              - key: service-account.json
                path: service-account.json
      nodeSelector:
        Application: platform
        Archtype: x86
        kubernetes.io/arch: amd64
      tolerations:
        - key: dedicated.falco.org/platform
          operator: Equal
          value: "true"
          effect: NoSchedule
