apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-gateway-tls
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  dnsNames:
    - monitoring.prow.falco.org
  issuerRef:
    group: cert-manager.io
    kind: Issuer
    name: letsencrypt-prod-gateway
  privateKey:
    algorithm: ECDSA
    encoding: PKCS8
    rotationPolicy: Always
    size: 256
  revisionHistoryLimit: 2
  secretName: grafana-gateway-tls
