apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: oci-public
  namespace: envoy-gateway-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  gatewayClassName: envoy-public
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: oci-public
  listeners:
    - name: grafana-http
      hostname: oci-monitoring.prow.falco.org
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
    - name: grafana-https
      hostname: oci-monitoring.prow.falco.org
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - group: ""
            kind: Secret
            name: grafana-oci-gateway-tls
            namespace: monitoring
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
