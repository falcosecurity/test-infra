apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    chart: gateway-helm
    repoURL: docker.io/envoyproxy
    targetRevision: v1.8.3
    helm:
      releaseName: envoy-gateway
      values: |
        crds:
          enabled: false
        podDisruptionBudget:
          minAvailable: 1
        deployment:
          replicas: 2
          pod:
            nodeSelector:
              Application: platform
            tolerations:
              - key: dedicated.falco.org/platform
                operator: Equal
                value: "true"
                effect: NoSchedule
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: topology.kubernetes.io/zone
                whenUnsatisfiable: DoNotSchedule
                labelSelector:
                  matchLabels:
                    control-plane: envoy-gateway
        certgen:
          job:
            nodeSelector:
              Application: platform
            tolerations:
              - key: dedicated.falco.org/platform
                operator: Equal
                value: "true"
                effect: NoSchedule
  destination:
    server: "https://kubernetes.default.svc"
    namespace: envoy-gateway-system
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
