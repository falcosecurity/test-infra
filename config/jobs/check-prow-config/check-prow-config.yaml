presubmits:
  falcosecurity/test-infra:
    - name: check-prow-config
      branches:
        - ^master$
      decorate: true
      skip_report: false
      always_run: true
      spec:
        containers:
          - image: gcr.io/k8s-prow/checkconfig:v20240805-37a08f946
            command:
              - /bin/sh
              - -ec
            args:
              - |
                if [ -d config/prow/aws ] || [ -d config/jobs/aws ]; then
                  if [ -e config/config.yaml ] || [ -e config/plugins.yaml ]; then
                    echo "Mixed AWS Prow layouts are not supported" >&2
                    exit 1
                  fi
                  for job_path in config/jobs/* config/jobs/.[!.]* config/jobs/..?*; do
                    case "$job_path" in
                      config/jobs/aws|config/jobs/oci) continue ;;
                      *.yaml|*.yml) ;;
                      *) [ -d "$job_path" ] || continue ;;
                    esac
                    echo "AWS Prow jobs must be under config/jobs/aws: $job_path" >&2
                    exit 1
                  done
                  exec /ko-app/checkconfig \
                    --config-path=config/prow/aws/config.yaml \
                    --job-config-path=config/jobs/aws \
                    --plugin-config=config/prow/aws/plugins.yaml
                fi
                exec /ko-app/checkconfig \
                  --config-path=config/config.yaml \
                  --job-config-path=config/jobs \
                  --plugin-config=config/plugins.yaml
        nodeSelector:
          Archtype: "x86"
periodics:
- name: check-prow-config-periodic
  interval: 1h
  decorate: true
  extra_refs:
  - org: falcosecurity
    repo: test-infra
    base_ref: master
  spec:
    containers:
    - image: gcr.io/k8s-prow/checkconfig:v20240805-37a08f946
      command:
      - /bin/sh
      - -ec
      args:
      - |
        if [ -d config/prow/aws ] || [ -d config/jobs/aws ]; then
          if [ -e config/config.yaml ] || [ -e config/plugins.yaml ]; then
            echo "Mixed AWS Prow layouts are not supported" >&2
            exit 1
          fi
          for job_path in config/jobs/* config/jobs/.[!.]* config/jobs/..?*; do
            case "$job_path" in
              config/jobs/aws|config/jobs/oci) continue ;;
              *.yaml|*.yml) ;;
              *) [ -d "$job_path" ] || continue ;;
            esac
            echo "AWS Prow jobs must be under config/jobs/aws: $job_path" >&2
            exit 1
          done
          exec /ko-app/checkconfig \
            --config-path=config/prow/aws/config.yaml \
            --job-config-path=config/jobs/aws \
            --plugin-config=config/prow/aws/plugins.yaml
        fi
        exec /ko-app/checkconfig \
          --config-path=config/config.yaml \
          --job-config-path=config/jobs \
          --plugin-config=config/plugins.yaml
    nodeSelector:
      Archtype: "x86"
