presubmits:
  falcosecurity/.project:
    - name: peribolos-pre-submit
      branches:
        - ^main$
      decorate: true
      max_concurrency: 1
      skip_report: false
      run_if_changed: ^config/org\.yaml$
      spec:
        containers:
          - image: us-docker.pkg.dev/k8s-infra-prow/images/peribolos:v20260811-cafa49460@sha256:b86c98c82cf1d835b1ba37d134f62f4d2429156adfe050ec7718875e8e783c5d
            command:
              - /ko-app/peribolos
            args:
              - --allow-repo-archival
              - --config-path=config/org.yaml
              - --fix-org
              - --fix-org-members
              - --fix-repos
              - --fix-teams
              - --fix-team-members
              - --fix-team-repos
              - --github-endpoint=http://ghproxy.prow.svc.cluster.local
              - --github-endpoint=https://api.github.com
              - --github-hourly-tokens=1200
              - --github-token-path=/etc/github-token/oauth
            volumeMounts:
              - name: github
                mountPath: /etc/github-token
                readOnly: true
            name: automation
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: "2"
                memory: 3Gi
                ephemeral-storage: 4Gi
        volumes:
          - name: github
            secret:
              secretName: oauth-token
              defaultMode: 288
        nodeSelector:
          Application: automation
          Archtype: x86
          kubernetes.io/arch: amd64
        serviceAccountName: automation
        automountServiceAccountToken: false
        enableServiceLinks: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        tolerations:
          - key: dedicated.falco.org/automation
            operator: Equal
            value: "true"
            effect: NoSchedule
      job_queue_name: governance
      decoration_config:
        timeout: 1h
postsubmits:
  falcosecurity/.project:
    - name: peribolos-post-submit
      branches:
        - ^main$
      decorate: true
      max_concurrency: 1
      skip_report: false
      run_if_changed: ^config/org\.yaml$
      extra_refs: &peribolos-accepted-metadata
        - org: falcosecurity
          repo: .project
          base_ref: main
          path_alias: github.com/falcosecurity/project-governance
          workdir: true
          clone_depth: 1
          skip_submodules: true
      spec: &peribolos-apply-spec
        containers:
          - image: us-docker.pkg.dev/k8s-infra-prow/images/peribolos:v20260811-cafa49460@sha256:b86c98c82cf1d835b1ba37d134f62f4d2429156adfe050ec7718875e8e783c5d
            command:
              - /ko-app/peribolos
            args:
              - --confirm
              - --allow-repo-archival
              - --config-path=config/org.yaml
              - --fix-org
              - --fix-org-members
              - --fix-repos
              - --fix-teams
              - --fix-team-members
              - --fix-team-repos
              - --github-endpoint=http://ghproxy.prow.svc.cluster.local
              - --github-endpoint=https://api.github.com
              - --github-hourly-tokens=1200
              - --github-token-path=/etc/github-token/oauth
            volumeMounts:
              - name: github
                mountPath: /etc/github-token
                readOnly: true
            name: automation
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: "2"
                memory: 3Gi
                ephemeral-storage: 4Gi
        volumes:
          - name: github
            secret:
              secretName: oauth-token
              defaultMode: 288
        nodeSelector:
          Application: automation
          Archtype: x86
          kubernetes.io/arch: amd64
        serviceAccountName: automation
        automountServiceAccountToken: false
        enableServiceLinks: false
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          fsGroup: 65532
          seccompProfile:
            type: RuntimeDefault
        tolerations:
          - key: dedicated.falco.org/automation
            operator: Equal
            value: "true"
            effect: NoSchedule
      job_queue_name: governance
      decoration_config:
        timeout: 1h
  falcosecurity/test-infra:
    # Apply accepted .project configuration when the Peribolos jobs change.
    # This also activates the pending archival during the coordinated migration.
    - name: peribolos-configuration-post-submit
      branches:
        - ^master$
      decorate: true
      max_concurrency: 1
      skip_report: false
      run_if_changed: ^config/jobs/oci/peribolos/|^config/org\.yaml$
      extra_refs: *peribolos-accepted-metadata
      spec: *peribolos-apply-spec
      job_queue_name: governance
      decoration_config:
        timeout: 1h
periodics:
  - name: peribolos-periodic
    interval: 24h
    decorate: true
    max_concurrency: 1
    extra_refs:
      - org: falcosecurity
        repo: .project
        base_ref: main
    spec:
      containers:
        - image: us-docker.pkg.dev/k8s-infra-prow/images/peribolos:v20260811-cafa49460@sha256:b86c98c82cf1d835b1ba37d134f62f4d2429156adfe050ec7718875e8e783c5d
          command:
            - /ko-app/peribolos
          args:
            - --confirm
            - --allow-repo-archival
            - --config-path=config/org.yaml
            - --fix-org
            - --fix-org-members
            - --fix-repos
            - --fix-teams
            - --fix-team-members
            - --fix-team-repos
            - --github-endpoint=http://ghproxy.prow.svc.cluster.local
            - --github-endpoint=https://api.github.com
            - --github-hourly-tokens=1200
            - --github-token-path=/etc/github-token/oauth
          volumeMounts:
            - name: github
              mountPath: /etc/github-token
              readOnly: true
          name: automation
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
              ephemeral-storage: 4Gi
      volumes:
        - name: github
          secret:
            secretName: oauth-token
            defaultMode: 288
      nodeSelector:
        Application: automation
        Archtype: x86
        kubernetes.io/arch: amd64
      serviceAccountName: automation
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - key: dedicated.falco.org/automation
          operator: Equal
          value: "true"
          effect: NoSchedule
    job_queue_name: governance
    decoration_config:
      timeout: 1h
